name: Gungraun Bench

# Counts the slicing benchmarks' CPU instructions (gungraun / Valgrind Callgrind) for a PR, compared
# with its base commit counted with the PR's benchmark (`just ci-bench`). This job runs the PR's code
# with a read-only token (always so for PRs from forks), so it only uploads the report, with the PR
# number, as an artifact; `gungraun-comment.yml` posts it as a sticky PR comment.
#
# Informational: it never gates merges (don't make it a required check).

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benches/**'
      - 'tests/support/**'
      - 'Cargo.toml'
      - 'justfile'
      - '.github/workflows/gungraun-bench.yml'

permissions: { contents: read }

defaults:
  run: { shell: bash }

env:
  CARGO_TERM_COLOR: never

jobs:
  bench:
    name: Instruction counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { prefix-key: "v0-bench" }
      - uses: taiki-e/install-action@v2.87.4
        with: { tool: 'just' }
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Fetch the base commit to compare with
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: just ci-bench target/bench/summary.md "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Save the PR number for the comment workflow
        run: echo "$PR_NUMBER" > target/bench/pr-number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@v7
        with:
          name: instruction-counts
          path: |
            target/bench/summary.md
            target/bench/pr-number
          retention-days: 7
