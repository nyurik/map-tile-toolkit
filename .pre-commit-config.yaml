# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Insta binary snapshots (`assert_binary_snapshot!`) are byte-exact fixtures generated by
# `cargo insta` / `just bless`; `serde_json::to_vec_pretty` leaves no trailing newline. Formatters
# must not touch them — end-of-file-fixer adding a final newline (and editorconfig-checker flagging
# its absence) breaks the snapshot byte comparison. Exclude them from every hook.
exclude: '\.snap\.geojson$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-shebang-scripts-are-executable
        exclude: '.+\.rs' # would be triggered by #![some_attribute]
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [ --allow-multiple-documents ]
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ --fix=lf ]
      - id: trailing-whitespace

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
      - id: remove-tabs

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust Format
        description: "Automatically format Rust code with cargo fmt"
        entry: sh -c "cargo fmt --all"
        language: rust
        pass_filenames: false

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.6.1
    hooks:
      - id: editorconfig-checker
