<svg class="d" viewBox="0 0 878.8 502.8" role="img" aria-label="Polygon clipping keeps every vertex with an edge touching the tile's box and closes each ring past the box: a dropped excursion becomes synthetic corners one unit outside the box, or a straight chord, unless keeping its vertices is shorter; a covered tile gets the four corners, a tile inside a hole gets nothing. A hole crossing the tile keeps its own outside vertices, so where the exterior's far part was dropped, the hole can reach past the exterior: the piece is valid only inside the tile" xmlns="http://www.w3.org/2000/svg">
<title>Polygon clipping keeps every vertex with an edge touching the tile's box and closes each ring past the box: a dropped excursion becomes synthetic corners one unit outside the box, or a straight chord, unless keeping its vertices is shorter; a covered tile gets the four corners, a tile inside a hole gets nothing. A hole crossing the tile keeps its own outside vertices, so where the exterior's far part was dropped, the hole can reach past the exterior: the piece is valid only inside the tile</title>
<style>.d{--fg:var(--md-default-fg-color,#6e7781);--light:var(--md-default-fg-color--light,#848d97);
